name: GlassLED
options:
  bundleIdPrefix: com.example
targets:
  GlassLED:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [GlassLED]
    info:
      path: GlassLED/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: Connects to Glass and the LED matrix on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
