apply plugin: 'com.android.application'

android {
    namespace 'com.glassfollowwindow'
    compileSdk 34

    defaultConfig {
        applicationId "com.glassfollowwindow"
        minSdkVersion 19
        targetSdkVersion 23
        versionCode 5
        versionName "1.4"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
}
